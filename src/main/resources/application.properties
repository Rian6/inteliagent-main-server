spring.application.name=main-server
server.port=${PORT:8070}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/inteliagent}
spring.datasource.username=${DB_USER:inteliagent}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=5000
spring.jdbc.template.query-timeout=15
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=inteliagent-auth
security.cors.origins=${CORS_ORIGINS:http://localhost:5173}
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=2MB
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
server.compression.min-response-size=2048
